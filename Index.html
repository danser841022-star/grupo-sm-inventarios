<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c7a24b"><title>Grupo SM | Inventarios</title><style>

us:10px;background:#fff} .pin{letter-spacing:7px;text-align:center;font-size:24px} .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px} @media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}} .stat{border-radius:14px;padding:14px;background:#f5f5f5;border-left:5px solid var(--gold)} .stat.alert{border-left-color:var(--red);background:#fff0f0} .stat strong{display:block;font-size:24px;margin-top:4px} .tablewrap{overflow:auto;border-radius:12px;border:1px solid #ddd} table{width:100%;border-collapse:collapse;min-width:780px;background:#fff} th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px} th{background:#17191d;color:#fff;position:sticky;top:0} td input{min-width:75px;padding:8px} .alarm{color:var(--red);font-weight:800} .ok{color:var(--green);font-weight:800} .chart{height:220px;display:flex;align-items:end;gap:12px;padding:20px 8px 4px;border-bottom:1px solid #ccc} .barwrap{flex:1;text-align:center;min-width:45px} .bar{background:var(--gold);border-radius:8px 8px 0 0;min-height:3px} .bar.red{background:var(--red)} .barlabel{font-size:11px;margin-top:5px} .bottom{position:fixed;bottom:0;left:0;right:0;background:#111318;color:#fff;display:flex;justify-content:center;gap:6px;padding:9px;z-index:30} .bottom button{background:#252830;color:#fff;border-radius:10px;padding:9px 13px} .hidden{display:none!important} .pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eee;font-size:11px;font-weight:700} .warning{padding:10px;border-radius:12px;background:#fff4d6;border-left:4px solid var(--gold);font-size:13px} .success{padding:10px;border-radius:12px;background:#e9f6ea;border-left:4px solid var(--green);font-size:13px} .dangerbox{padding:10px;border-radius:12px;background:#ffebeb;border-left:4px solid var(--red);font-size:13px} .branchcard{border:1px solid #ddd;border-radius:16px;padding:14px;background:linear-gradient(135deg,#fff,#f4f4f4)} .branchcard.alert{border-color:#e36b6b;background:#fff3f3} .branchtitle{display:flex;justify-content:space-between;align-items:center;gap:8px}.miniStats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.miniStat{background:#f1f2f4;border-radius:10px;padding:9px;font-size:11px}.miniStat b{display:block;font-size:18px;margin-top:3px}.kpiBig{font-size:30px;font-weight:800}.compareGrid{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:760px){.compareGrid{grid-template-columns:repeat(2,1fr)}} .selectBtn{width:100%;margin-top:10px}

const BRANCHES=['SM','VIP','SPORT','VIP PLANTA ALTA','ISLA'];
const PRODUCTS={SM:['TENIS COLOR S061','TENIS EXCLUSIVOS S061','AF1 S005'],VIP:['TENIS COLOR S061','TENIS EXCLUSIVO S061','TENIS AF1','TENIS DISEÑADOR VIP','TENIS PREMIUM VIP'],SPORT:['EXCLUSIVOS S061','COLOR S061','AF1 S005'],'VIP PLANTA ALTA':[],'ISLA':[]};

let state={branch:null,user:null,rows:[],view:'home'};
const key=b=>'gsm_inv_'+b.replaceAll(' ','_');
function load(b){try{return JSON.parse(localStorage.getItem(key(b))||'[]')}catch{return[]}}
function save(b,data){localStorage.setItem(key(b),JSON.stringify(data))}
function fmt(n){return Number(n||0).toLocaleString('es-MX')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.cssText='position:fixed;top:78px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:10px;z-index:99';t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function header(){return `<header><img class="logo" src="${LOGO}"><div class="brand"><h1>GRUPO SM | INVENTARIOS</h1><small>${state.branch?esc(state.branch):'Control de inventarios'}</small></div></header>`}
function render(){document.getElementById('app').innerHTML=header()+`<main class="screen">${state.view==='home'?home():state.view==='login'?login():state.view==='dashboard'?dashboard():state.view==='inventory'?inventory():state.view==='history'?history():''}</main>${state.user?bottom():''}`; bind()}
function home(){return `<section class="card hero"><img class="biglogo" src="${LOGO}"><h2>Control de Inventarios</h2><p class="muted">Inventarios semanales • Miércoles y jueves</p><div class="success">Selecciona la sucursal para comenzar. La aplicación conserva los últimos 4 inventarios por sucursal.</div></section><section class="card"><h3>Selecciona una sucursal</h3><div class="grid">${BRANCHES.map(b=>`<button class="branch" data-branch="${esc(b)}">${esc(b)}</button>`).join('')}</div></section><section class="card"><h3>Acceso administrativo</h3><button class="btn goldbtn" id="adminBtn">Dashboard general</button></section>`}
function login(){return `<section class="card hero"><img class="biglogo" src="${LOGO}"><h2>Acceso • ${esc(state.branch)}</h2><p class="muted">Ingresa el NIP de la persona responsable.</p><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><br><br><button class="btn goldbtn" id="enter">Entrar</button><button class="btn ghost" id="back">Regresar</button><p class="muted" style="font-size:11px;margin-top:16px">Los NIP iniciales son configurables desde el código de la aplicación.</p></section>`}
function bottom(){return `<nav class="bottom"><button id="homeBtn">Inicio</button><button id="dashBtn">Dashboard</button><button id="invBtn">Inventario</button><button id="histBtn">Historial</button><button id="logout">Salir</button></nav>`}
function totals(rows){return rows.reduce((a,r)=>{a.ph+=+r.ph||0;a.sys+=+r.sys||0;a.form+=+r.form||0;a.real+=Math.max((+r.sys||0)-(+r.ph||0)-(+r.form||0),0);return a},{ph:0,sys:0,form:0,real:0})}
function latest(branch){let a=load(branch);return a.length?a[a.length-1]:null}
function latestRows(branch){let x=latest(branch);return x&&Array.isArray(x.rows)?x.rows:[]}
function dashboard(){if(state.branch==='ADMIN')return adminDashboard();let rec=latest(state.branch);let rows=rec?rec.rows:[];let t=rec?rec.t:totals(rows);return `<section class="card"><div class="actions"><button class="btn goldbtn" id="newInv">+ Nuevo inventario</button><button class="btn ghost" id="historyBtn">Ver comparativos</button><button class="btn ghost" id="adminHome">Dashboard general</button></div></section><section class="card"><h2>Dashboard • ${esc(state.branch)}</h2><p class="muted">Responsable: ${esc(rec?.person||state.user||'—')} ${rec?.date?'• '+esc(rec.date):''}</p><div class="stats"><div class="stat"><span>Productos físicos</span><strong>${fmt(t.ph)}</strong></div><div class="stat"><span>Registrados sistema</span><strong>${fmt(t.sys)}</strong></div><div class="stat"><span>Formatos de salida</span><strong>${fmt(t.form)}</strong></div><div class="stat ${t.real?'alert':''}"><span>Faltantes reales</span><strong class="${t.real?'alarm':''}">${fmt(t.real)}</strong></div></div></section><section class="card"><h3>Indicadores por producto</h3><div class="chart">${chartBars(rows)}</div><p class="muted" style="font-size:11px">Rojo = faltante real detectado.</p></section><section class="card"><h3>Último inventario</h3>${rec?`<div class="success">Registrado el ${esc(rec.date)} por ${esc(rec.person)}. Los datos quedan disponibles en el comparativo de los últimos 4 inventarios.</div>`:'<div class="warning">Todavía no hay un inventario registrado para esta sucursal.</div>'}</section>`}
function adminDashboard(){let summaries=BRANCHES.map(b=>{let r=latest(b);let t=r?r.t:totals([]);return {b,r,t}});let gt=summaries.reduce((a,x)=>({ph:a.ph+x.t.ph,sys:a.sys+x.t.sys,form:a.form+x.t.form,real:a.real+x.t.real}),{ph:0,sys:0,form:0,real:0});return `<section class="card hero"><img class="biglogo" src="${LOGO}"><div class="admin-title"><h2>Dashboard General</h2><svg class="spartan-helmet" viewBox="0 0 64 64" aria-label="Casco de guerrero espartano" role="img"><path d="M15 45c0-15 3-27 17-33 14 6 17 18 17 33l-8 0c0-8-2-16-9-21-7 5-9 13-9 21z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M32 7v10M24 9l-4 9M40 9l4 9M13 45h38M18 50h28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M23 24c3 2 5 3 9 3s6-1 9-3M27 28v9l5 5 5-5v-9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg></div><p class="muted">Control consolidado de las 5 sucursales</p><div class="actions" style="justify-content:center"><button class="btn goldbtn" id="newInvAdmin">Ver sucursal para capturar inventario</button></div></section><section class="card"><h3>Resumen general</h3><div class="stats"><div class="stat"><span>Total físico</span><strong>${fmt(gt.ph)}</strong></div><div class="stat"><span>Total en sistema</span><strong>${fmt(gt.sys)}</strong></div><div class="stat"><span>Formatos utilizados</span><strong>${fmt(gt.form)}</strong></div><div class="stat ${gt.real?'alert':''}"><span>Faltantes reales</span><strong class="${gt.real?'alarm':''}">${fmt(gt.real)}</strong></div></div></section><section class="card"><h3>Estado por sucursal</h3><div class="compareGrid">${summaries.map(x=>branchCard(x)).join('')}</div></section><section class="card"><h3>Comparativo de faltantes por sucursal</h3><div class="chart">${branchBars(summaries)}</div><p class="muted" style="font-size:11px">La altura representa faltantes reales del último inventario registrado.</p></section><section class="card"><h3>Últimos 4 inventarios</h3>${globalHistory(summaries)}</section>`}
function branchCard(x){let alert=x.t.real>0?'alert':'';return `<div class="branchcard ${alert}"><div class="branchtitle"><strong>${esc(x.b)}</strong><span class="pill">${x.r?esc(x.r.date):'Sin inventario'}</span></div><div class="miniStats"><div class="miniStat">Físico<b>${fmt(x.t.ph)}</b></div><div class="miniStat">Sistema<b>${fmt(x.t.sys)}</b></div><div class="miniStat">Formatos<b>${fmt(x.t.form)}</b></div><div class="miniStat">Faltantes<b class="${x.t.real?'alarm':'ok'}">${fmt(x.t.real)}</b></div></div><button class="btn ghost selectBtn" data-viewbranch="${esc(x.b)}">Abrir sucursal</button></div>`}
function branchBars(summaries){let a=summaries.filter(x=>x.t.real>0);let mx=Math.max(1,...a.map(x=>x.t.real));return a.length?a.map(x=>`<div class="barwrap"><div class="bar red" style="height:${Math.max(4,x.t.real/mx*160)}px"></div><div class="barlabel">${esc(x.b)}<br><b>${fmt(x.t.real)}</b></div></div>`).join(''):'<div class="success" style="width:100%">Sin faltantes reales registrados.</div>'}
function chartBars(rows){let a=rows.map(r=>({n:r.name,f:Math.max((+r.sys||0)-(+r.ph||0)-(+r.form||0),0)})).filter(x=>x.f>0).sort((a,b)=>b.f-a.f).slice(0,8);let mx=Math.max(1,...a.map(x=>x.f));return a.length?a.map(x=>`<div class="barwrap"><div class="bar red" style="height:${Math.max(4,x.f/mx*160)}px"></div><div class="barlabel">${esc(x.n).slice(0,14)}<br><b>${fmt(x.f)}</b></div></div>`).join(''):'<div class="success" style="width:100%">Sin faltantes reales registrados.</div>'}
function globalHistory(summaries){let any=false;let html='<div class="tablewrap"><table><thead><tr><th>Sucursal</th><th>Fecha</th><th>Persona</th><th>Físico</th><th>Formatos</th><th>Faltantes</th></tr></thead><tbody>';summaries.forEach(x=>{let h=load(x.b).slice(-4).reverse();h.forEach(r=>{any=true;html+=`<tr><td>${esc(x.b)}</td><td>${esc(r.date)}</td><td>${esc(r.person)}</td><td>${fmt(r.t.ph)}</td><td>${fmt(r.t.form)}</td><td class="${r.t.real?'alarm':'ok'}">${fmt(r.t.real)}</td></tr>`})});return any?html+'</tbody></table></div>':'<p class="muted">Todavía no hay inventarios registrados.</p>'}
function inventory(){let rows=state.rows.length?state.rows:load(state.branch); if(!rows.length) rows=[{name:'',ph:0,sys:0,form:0}]; state.rows=rows;let today=new Date();let day=today.getDay();let allowed=day===3||day===4;return `<section class="card"><div class="actions"><button class="btn ghost" id="addRow">+ Agregar producto</button><button class="btn goldbtn" id="saveInv">Guardar inventario</button></div><p class="${allowed?'success':'warning'}">${allowed?'Hoy es día autorizado para inventario (miércoles/jueves).':'Aviso: el inventario está diseñado para realizarse miércoles y jueves; puedes capturar de todas formas.'}</p><div class="grid"><div><label>Sucursal</label><input value="${esc(state.branch)}" disabled></div><div><label>Persona que elabora</label><input id="person" value="${esc(state.user||'')}"></div><div><label>Fecha</label><input id="date" type="date" value="${today.toISOString().slice(0,10)}"></div></div></section><section class="card"><h3>Captura del inventario</h3><div class="tablewrap"><table><thead><tr><th>Nombre del producto / Serie</th><th>Contados en físico</th><th>Registrados en sistema</th><th>Formatos que justifican salida</th><th>Faltantes reales</th></tr></thead><tbody>${state.rows.map((r,i)=>rowHtml(r,i)).join('')}</tbody></table></div></section>`}
function rowHtml(r,i){let real=Math.max((+r.sys||0)-(+r.ph||0)-(+r.form||0),0);return `<tr><td><input data-i="${i}" data-k="name" value="${esc(r.name)}" placeholder="Ej. Tenis S061"></td><td><input data-i="${i}" data-k="ph" type="number" min="0" value="${r.ph||0}"></td><td><input data-i="${i}" data-k="sys" type="number" min="0" value="${r.sys||0}"></td><td><input data-i="${i}" data-k="form" type="number" min="0" value="${r.form||0}"></td><td class="${real?'alarm':'ok'}"><b>${fmt(real)}</b></td></tr>`}
function historyMini(){let data=load(state.branch).slice(-4).reverse();return data.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Persona</th><th>Físico</th><th>Sistema</th><th>Formatos</th><th>Faltantes reales</th></tr></thead><tbody>${data.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.person)}</td><td>${fmt(x.t.ph)}</td><td>${fmt(x.t.sys)}</td><td>${fmt(x.t.form)}</td><td class="${x.t.real?'alarm':'ok'}">${fmt(x.t.real)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Aún no hay inventarios anteriores guardados.</p>'}
function history(){let data=load(state.branch);return `<section class="card"><div class="actions"><button class="btn ghost" id="backDash">← Dashboard</button><button class="btn goldbtn" id="newInv">+ Nuevo inventario</button></div><h2>Comparativo • últimos 4 inventarios</h2><p class="muted">${esc(state.branch)} • Se conservan los 4 registros más recientes.</p>${data.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Persona</th><th>Productos físicos</th><th>Sistema</th><th>Formatos</th><th>Faltantes reales</th></tr></thead><tbody>${data.slice(-4).reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.person)}</td><td>${fmt(x.t.ph)}</td><td>${fmt(x.t.sys)}</td><td>${fmt(x.t.form)}</td><td class="${x.t.real?'alarm':'ok'}">${fmt(x.t.real)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Todavía no hay inventarios guardados.</p>'}</section><section class="card"><h3>Detalle del último inventario</h3>${data.length?`<div class="tablewrap"><table><thead><tr><th>Producto / Serie</th><th>Físico</th><th>Sistema</th><th>Formatos</th><th>Faltante real</th></tr></thead><tbody>${data[data.length-1].rows.map(r=>{let f=Math.max((+r.sys||0)-(+r.ph||0)-(+r.form||0),0);return `<tr><td>${esc(r.name)}</td><td>${fmt(r.ph)}</td><td>${fmt(r.sys)}</td><td>${fmt(r.form)}</td><td class="${f?'alarm':'ok'}">${fmt(f)}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">Sin detalle disponible.</p>'}</section>`}
function bind(){document.querySelectorAll('[data-branch]').forEach(b=>b.onclick=()=>{state.branch=b.dataset.branch;state.view='login';render()});document.querySelectorAll('[data-viewbranch]').forEach(b=>b.onclick=()=>{state.branch=b.dataset.viewbranch;state.user=NAMES[state.branch];state.view='dashboard';render()});let x=id=>document.getElementById(id);if(x('adminBtn'))x('adminBtn').onclick=()=>{state.branch='ADMIN';state.user='Administrador';state.view='dashboard';render()};if(x('adminHome'))x('adminHome').onclick=()=>{state.branch='ADMIN';state.user='Administrador';state.view='dashboard';render()};if(x('backDash'))x('backDash').onclick=()=>{state.view='dashboard';render()};if(x('newInvAdmin'))x('newInvAdmin').onclick=()=>{state.branch=null;state.user=null;state.view='home';render()};if(x('back'))x('back').onclick=()=>{state.view='home';render()};if(x('enter'))x('enter').onclick=()=>{let pin=x('pin').value;if(pin===PINS[state.branch]){state.user=NAMES[state.branch];state.view='dashboard';render()}else toast('NIP incorrecto')};if(x('newInv'))x('newInv').onclick=()=>{if(state.branch==='ADMIN'){state.view='home';state.branch=null;state.user=null;render();return}let last=load(state.branch);state.rows=last.length?last[last.length-1].rows.map(r=>({...r})):PRODUCTS[state.branch].map(name=>({name,ph:0,sys:0,form:0}));if(!state.rows.length)state.rows=[{name:'',ph:0,sys:0,form:0}];state.view='inventory';render()};if(x('historyBtn'))x('historyBtn').onclick=()=>{state.view='history';render()};if(x('homeBtn'))x('homeBtn').onclick=()=>{state.view='home';state.branch=null;render()};if(x('dashBtn'))x('dashBtn').onclick=()=>{state.view='dashboard';render()};if(x('invBtn'))x('invBtn').onclick=()=>{if(state.branch==='ADMIN'){state.view='home';state.branch=null;state.user=null;render();return}let last=load(state.branch);state.rows=last.length?last[last.length-1].rows.map(r=>({...r})):PRODUCTS[state.branch].map(name=>({name,ph:0,sys:0,form:0}));if(!state.rows.length)state.rows=[{name:'',ph:0,sys:0,form:0}];state.view='inventory';render()};if(x('histBtn'))x('histBtn').onclick=()=>{if(state.branch==='ADMIN'){state.view='dashboard';render();return}state.view='history';render()};if(x('logout'))x('logout').onclick=()=>{state={branch:null,user:null,rows:[],view:'home'};render()};if(x('addRow'))x('addRow').onclick=()=>{state.rows.push({name:'',ph:0,sys:0,form:0});render()};document.querySelectorAll('input[data-i]').forEach(inp=>inp.oninput=()=>{let i=+inp.dataset.i,k=inp.dataset.k;state.rows[i][k]=k==='name'?inp.value:Number(inp.value||0);let td=inp.closest('tr').children[4],real=Math.max((+state.rows[i].sys||0)-(+state.rows[i].ph||0)-(+state.rows[i].form||0),0);td.innerHTML='<b>'+fmt(real)+'</b>';td.className=real?'alarm':'ok'});if(x('saveInv'))x('saveInv').onclick=()=>{state.rows=state.rows.filter(r=>r.name.trim());let t=totals(state.rows);let all=load(state.branch);all.push({date:x('date').value,person:x('person').value||state.user,rows:state.rows,t});all=all.slice(-4);save(state.branch,all);toast('Inventario guardado correctamente');setTimeout(()=>{state.view='dashboard';render()},500)}}

render();
</script></body></html>
